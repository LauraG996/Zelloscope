[project]
name = "zelloscope-profile"
version = "0.1.0"
description = "Zelloscope profile shape check and shape-variation analysis for foam U-profiles (cut-end images)"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.8", "numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
analysis = ["scipy>=1.10", "scikit-image>=0.22", "scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2.0"]
test = ["pytest>=7"]

[project.scripts]
zelloscope-profile = "profile_check.cli:main"
zelloscope-variation = "shape_variation.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["profile_check", "shape_variation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
